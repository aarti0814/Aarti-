<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Balls, 1 Rule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: a fixed 1080×1920 (YouTube Shorts) canvas, scaled to fit the screen. */
  :root {
    --bg: #070912;
    --ink: #f2f5ff;
    --muted: #8590aa;
    --gold: #ffcc3d;
    --font-d: "Orbitron", "Arial Black", system-ui, sans-serif;
    --font-m: "Share Tech Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { overflow: hidden; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  #view { display: block; background: var(--bg); }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh); cursor: pointer; font-family: var(--font-m); text-align: center; }
  .overlay p { margin: 0; font-size: 14px; color: var(--muted); }
  .tap { font: 900 17px/1 var(--font-d); letter-spacing: 0.1em; color: var(--bg); background: var(--gold); border: 0; border-radius: 6px; padding: 16px 28px; cursor: pointer; }
  .tap:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view" width="1080" height="1920" aria-label="100 numbered balls following the Collatz rule"></canvas>
<div class="overlay" id="startUi"><button class="tap" id="startBtn" type="button">TAP TO START</button><p>Sound on.</p></div>

<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const RENDER = params.has("render");          // frame-by-frame mode used to make the MP4

  // ---------- Layout (fixed 1080×1920) ----------
  const W = 1080, H = 1920;
  const AX = 40, AY = 300, AW = 1000, AH = 1030;          // arena
  const CHART = { x: 60, y: 1492, w: 960, h: 160 };
  const TRAY = { x: 40, y: 1700, cols: 20, cell: 50, row: 40 };
  const START_MOVING = 8.6;                     // balls wait while the rule is explained
  const SPEED = 1400;

  // ---------- Look ----------
  const BG = "#070912", INK = "#f2f5ff", MUTED = "#8590aa", GOLD = "#ffcc3d", EVEN = "#2ed6ff", ODD = "#ff8a3d";
  const FD = '"Orbitron", "Arial Black", system-ui, sans-serif';
  const FM = '"Share Tech Mono", ui-monospace, Menlo, monospace';

  // ---------- Deterministic random ----------
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + rnd() * (b - a);

  const rOf = (n) => 11 + 4.3 * Math.log2(n + 1);
  const PATH27 = (() => { const p = [27]; let x = 27; while (x !== 1) { x = x % 2 ? 3 * x + 1 : x / 2; p.push(x); } return p; })();

  // ---------- State ----------
  let VT = 0, FF = 1, lastHomeVT = null, peak27VT = null, balls, homeCount, T, events, captions = [], stepsOf27, lastHomeT, peak27T, firstHomeT, shake, flashes;
  function reset() {
    seed = 7;
    VT = 0; FF = 1; lastHomeVT = null; peak27VT = null;
    balls = []; homeCount = 0; T = 0; events = []; stepsOf27 = 0; lastHomeT = null; peak27T = null; firstHomeT = null; shake = 0; flashes = [];
    const order = Array.from({ length: 100 }, (_, i) => i + 1);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order.forEach((id, k) => {
      const cx = AX + 50 + (k % 10) * 100 + rr(-12, 12), cy = AY + 52 + Math.floor(k / 10) * 102 + rr(-10, 10);
      const a = rr(0, 6.283);
      const b = { id, n: id, r: rOf(id), x: cx, y: cy, vx: Math.cos(a) * SPEED, vy: Math.sin(a) * SPEED, cool: 0, pop: 0, home: false, slot: -1, ht: 0, hx: 0, hy: 0, steps: 0 };
      balls.push(b);
    });
    const one = balls.find((b) => b.id === 1); sendHome(one, true);
  }
  function slotPos(s) { return [TRAY.x + TRAY.cell / 2 + (s % TRAY.cols) * TRAY.cell, TRAY.y + 26 + Math.floor(s / TRAY.cols) * TRAY.row]; }
  function sendHome(b, instant) {
    b.home = true; b.slot = homeCount++; b.ht = instant ? 1 : 0; b.hx = b.x; b.hy = b.y;
    if (!instant) { events.push({ t: T, vt: VT, type: "home", id: b.id, k: b.slot }); if (firstHomeT === null) firstHomeT = T; }
    if (homeCount === 100) { lastHomeT = T; lastHomeVT = VT; events.push({ t: T, vt: VT, type: "all" }); }
  }
  function collatz(b) {
    const odd = b.n % 2 === 1;
    b.n = odd ? 3 * b.n + 1 : b.n / 2; b.steps++; b.pop = 1;
    events.push({ t: T, vt: VT, type: odd ? "up" : "down", n: b.n, id: b.id });
    if (b.id === 27) { stepsOf27 = b.steps; if (b.n === 9232 && peak27T === null) { peak27T = T; peak27VT = VT; events.push({ t: T, vt: VT, type: "peak27" }); shake = 1; flashes.push({ x: b.x, y: b.y, life: 1 }); } }
    if (b.n === 1) sendHome(b, false);
  }

  function step(dt) {
    T += dt;
    shake = Math.max(0, shake - dt * 2);
    for (const f of flashes) f.life -= dt * 1.5;
    flashes = flashes.filter((f) => f.life > 0);
    const live = balls.filter((b) => !b.home);
    for (const b of balls) {
      b.pop = Math.max(0, b.pop - dt * 4);
      if (b.home && b.ht < 1) b.ht = Math.min(1, b.ht + dt * 1.6);
    }
    if (T < START_MOVING) {               // waiting: gentle bob
      for (const b of live) b.r += (rOf(b.n) - b.r) * Math.min(1, dt * 10);
      return;
    }
    const sub = 6, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const b of live) {
        if (b.home) continue;
        b.r += (rOf(b.n) - b.r) * Math.min(1, h * 9);
        b.cool -= h;
        b.x += b.vx * h; b.y += b.vy * h;
        let hit = false;
        if (b.x - b.r < AX) { b.x = AX + b.r; if (b.vx < 0) { b.vx = -b.vx; hit = true; } }
        else if (b.x + b.r > AX + AW) { b.x = AX + AW - b.r; if (b.vx > 0) { b.vx = -b.vx; hit = true; } }
        if (b.y - b.r < AY) { b.y = AY + b.r; if (b.vy < 0) { b.vy = -b.vy; hit = true; } }
        else if (b.y + b.r > AY + AH) { b.y = AY + AH - b.r; if (b.vy > 0) { b.vy = -b.vy; hit = true; } }
        if (hit && b.cool <= 0) { b.cool = 0.12; collatz(b); }
        const sp = Math.hypot(b.vx, b.vy) || 1, k = 1 + (SPEED / sp - 1) * 0.05; b.vx *= k; b.vy *= k;
      }
      // ball-ball collisions (mass ∝ area); they never change numbers
      for (let i = 0; i < live.length; i++) {
        const a = live[i]; if (a.home) continue;
        for (let j = i + 1; j < live.length; j++) {
          const c = live[j]; if (c.home) continue;
          let dx = c.x - a.x, dy = c.y - a.y; const min = a.r + c.r, d2 = dx * dx + dy * dy;
          if (d2 >= min * min) continue;
          let d = Math.sqrt(d2); if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
          const nx = dx / d, ny = dy / d, ma = a.r * a.r, mc = c.r * c.r, ov = min - d;
          a.x -= nx * ov * mc / (ma + mc); a.y -= ny * ov * mc / (ma + mc);
          c.x += nx * ov * ma / (ma + mc); c.y += ny * ov * ma / (ma + mc);
          const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (rv < 0) { const jj = 2 * rv / (ma + mc); a.vx += jj * mc * nx; a.vy += jj * mc * ny; c.vx -= jj * ma * nx; c.vy -= jj * ma * ny; }
        }
      }
    }
  }

  // ---------- Drawing ----------
  const view = document.getElementById("view"), g = view.getContext("2d", { alpha: false });
  const stat = document.createElement("canvas"); stat.width = W; stat.height = H;
  function glowText(txt, x, y, font, col, align = "center", strong = 1) {
    g.font = font; g.textAlign = align; g.textBaseline = "middle"; g.strokeStyle = col; g.lineJoin = "round";
    g.globalAlpha = 0.14 * strong; g.lineWidth = 16; g.strokeText(txt, x, y);
    g.globalAlpha = 0.28 * strong; g.lineWidth = 7; g.strokeText(txt, x, y);
    g.globalAlpha = 1; g.fillStyle = col; g.fillText(txt, x, y);
  }
  function drawStatic() {
    const c = stat.getContext("2d");
    c.fillStyle = BG; c.fillRect(0, 0, W, H);
    const vg = c.createRadialGradient(W / 2, 800, 100, W / 2, 800, 1300); vg.addColorStop(0, "#111833"); vg.addColorStop(1, BG);
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    c.font = `900 70px ${FD}`; c.textAlign = "center"; c.textBaseline = "middle";
    c.shadowColor = INK; c.shadowBlur = 24; c.fillStyle = INK; c.fillText("100 BALLS.", W / 2, 92);
    c.shadowColor = GOLD; c.fillStyle = GOLD; c.fillText("1 RULE.", W / 2, 172); c.shadowBlur = 0;
    // rule chips
    const chips = [["EVEN → ÷2", EVEN], ["ODD → ×3+1", ODD], ["HIT 1 → FREE", GOLD]];
    c.font = `26px ${FM}`;
    const ws = chips.map(([t]) => c.measureText(t).width + 40), total = ws.reduce((a, b) => a + b, 0) + 24 * 2;
    let x = (W - total) / 2;
    chips.forEach(([t, col], i) => {
      c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath(); c.roundRect(x, 222, ws[i], 48, 24); c.stroke();
      c.fillStyle = col; c.textAlign = "center"; c.fillText(t, x + ws[i] / 2, 247); x += ws[i] + 24;
    });
    // arena
    c.fillStyle = "rgba(255,255,255,0.025)"; c.fillRect(AX, AY, AW, AH);
    c.strokeStyle = "rgba(242,245,255,0.75)"; c.lineWidth = 4; c.strokeRect(AX, AY, AW, AH);
    // chart frame
    c.font = `22px ${FM}`; c.fillStyle = MUTED; c.textAlign = "left"; c.fillText("BALL #27'S JOURNEY", CHART.x, CHART.y - 22);
    c.textAlign = "right"; c.fillText("STEPS →", CHART.x + CHART.w, CHART.y + CHART.h + 22);
    c.strokeStyle = "rgba(242,245,255,0.2)"; c.lineWidth = 1;
    for (let k = 0; k <= 4; k++) { const y = CHART.y + CHART.h * k / 4 + 0.5; c.beginPath(); c.moveTo(CHART.x, y); c.lineTo(CHART.x + CHART.w, y); c.stroke(); }
    // tray
    c.font = `22px ${FM}`; c.fillStyle = GOLD; c.textAlign = "left"; c.fillText("REACHED 1", TRAY.x, TRAY.y - 8);
    for (let s = 0; s < 100; s++) { const [sx, sy] = slotPos(s); c.strokeStyle = "rgba(255,204,61,0.18)"; c.lineWidth = 2; c.beginPath(); c.arc(sx, sy, 15, 0, 6.2832); c.stroke(); }
  }
  function drawBall(b, x, y, r, gold) {
    const col = gold ? GOLD : (b.n % 2 ? ODD : EVEN);
    const s = r * (1 + b.pop * 0.12);
    g.fillStyle = col; g.globalAlpha = 0.18; g.beginPath(); g.arc(x, y, s * 1.35, 0, 6.2832); g.fill();
    g.globalAlpha = 1;
    const gr = g.createRadialGradient(x - s * 0.35, y - s * 0.4, s * 0.1, x, y, s);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.25, col); gr.addColorStop(1, shadeOf(col));
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, s, 0, 6.2832); g.fill();
    const label = b.n.toLocaleString("en-US");
    const fs = Math.max(11, Math.min(s * 0.85, (s * 1.7) / Math.max(1, label.length * 0.62)));
    g.font = `900 ${fs}px ${FD}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#0a0d18";
    g.fillText(gold ? String(b.id) : label, x, y + 1);
    if (!gold && s > 30) { g.font = `${Math.max(11, s * 0.28)}px ${FM}`; g.fillStyle = "rgba(10,13,24,0.75)"; g.fillText("#" + b.id, x, y + fs * 0.75); }
  }
  const shadeOf = (c) => c === GOLD ? "#9c6a00" : c === ODD ? "#a83d0c" : "#0b6f8f";
  function caption(text, y) {
    g.font = `900 46px ${FD}`;
    const lines = wrap(text, 900);
    lines.forEach((ln, i) => {
      const yy = y + i * 58;
      const w = g.measureText(ln).width + 36;
      g.fillStyle = "rgba(7,9,18,0.78)"; g.beginPath(); g.roundRect(W / 2 - w / 2, yy - 30, w, 60, 12); g.fill();
      g.fillStyle = INK; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(ln, W / 2, yy + 2);
    });
  }
  function wrap(text, maxW) {
    const words = text.split(" "), out = []; let cur = "";
    for (const w of words) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    if (cur) out.push(cur); return out;
  }
  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
    g.drawImage(stat, 0, 0);
    const sx = (rnd() - 0.5) * shake * 18 * 0, sy = 0; void sx; void sy;
    const jx = (Math.sin(T * 91) * shake * 9), jy = (Math.cos(T * 77) * shake * 9);
    g.setTransform(1, 0, 0, 1, jx, jy);
    // arena balls (clip)
    g.save(); g.beginPath(); g.rect(AX + 2, AY + 2, AW - 4, AH - 4); g.clip();
    const live = balls.filter((b) => !b.home).sort((a, b) => a.r - b.r);
    const bob = T < START_MOVING ? 1 : 0;
    for (const b of live) {
      const by = bob ? Math.sin(T * 2.2 + b.id) * 4 : 0;
      drawBall(b, b.x, b.y + by, b.r, false);
      if (b.id === 27 && T > 17) {     // spotlight on #27
        g.strokeStyle = GOLD; g.lineWidth = 5; g.globalAlpha = 0.6 + 0.4 * Math.sin(T * 8);
        g.beginPath(); g.arc(b.x, b.y, b.r + 14, 0, 6.2832); g.stroke(); g.globalAlpha = 1;
        g.font = `900 26px ${FD}`; g.fillStyle = GOLD; g.textAlign = "center"; g.fillText("#27", b.x, b.y - b.r - 30);
      }
    }
    for (const f of flashes) { g.globalAlpha = f.life * 0.6; g.fillStyle = "#fff"; g.beginPath(); g.arc(f.x, f.y, 140 * (1.6 - f.life), 0, 6.2832); g.fill(); g.globalAlpha = 1; }
    g.restore();
    // balls flying home and resting in the tray
    for (const b of balls.filter((b) => b.home)) {
      const [tx, ty] = slotPos(b.slot), e = 1 - Math.pow(1 - b.ht, 3);
      const x = b.hx + (tx - b.hx) * e, y = b.hy + (ty - b.hy) * e - Math.sin(e * Math.PI) * 120;
      const r = 26 + (15 - 26) * e;
      drawBall(b, x, y, r, true);
    }
    // stats row
    const out = balls.filter((b) => !b.home);
    const top = out.reduce((m, b) => (b.n > m.n ? b : m), { n: 0, id: 0 });
    g.font = `26px ${FM}`; g.textBaseline = "middle"; g.textAlign = "left"; g.fillStyle = MUTED; g.fillText("STILL BOUNCING", AX, 1368);
    glowText(String(out.length), AX, 1402, `900 40px ${FD}`, INK, "left", 0.6);
    g.textAlign = "right"; g.font = `26px ${FM}`; g.fillStyle = MUTED; g.fillText("BIGGEST NUMBER NOW", AX + AW, 1368);
    glowText(top.n ? `${top.n.toLocaleString("en-US")}  (#${top.id})` : "—", AX + AW, 1402, `900 40px ${FD}`, top.n % 2 ? ODD : EVEN, "right", 0.6);
    // chart of #27
    const maxV = 9232, steps = PATH27.length - 1;
    const px = (i) => CHART.x + CHART.w * i / steps, py = (v) => CHART.y + CHART.h - CHART.h * v / maxV;
    g.strokeStyle = GOLD; g.lineWidth = 3.5; g.lineJoin = "round"; g.beginPath();
    for (let i = 0; i <= stepsOf27; i++) { const X = px(i), Y = py(PATH27[i]); if (i) g.lineTo(X, Y); else g.moveTo(X, Y); }
    g.stroke();
    if (stepsOf27 >= 0) { g.fillStyle = "#fff"; g.beginPath(); g.arc(px(stepsOf27), py(PATH27[stepsOf27]), 7, 0, 6.2832); g.fill(); }
    if (stepsOf27 >= 77) { g.font = `900 24px ${FD}`; g.fillStyle = GOLD; g.textAlign = "center"; g.fillText("PEAK 9,232", px(77), CHART.y - 4); }
    g.font = `20px ${FM}`; g.fillStyle = MUTED; g.textAlign = "right"; g.fillText(`STEP ${stepsOf27} / ${steps}`, CHART.x + CHART.w, CHART.y - 22);
    if (FF > 1.15 && lastHomeT === null) {
      g.globalAlpha = Math.min(1, (FF - 1) / 0.8);
      g.fillStyle = "rgba(7,9,18,0.8)"; g.beginPath(); g.roundRect(AX + AW - 220, AY + 16, 200, 52, 10); g.fill();
      g.font = `900 28px ${FD}`; g.fillStyle = GOLD; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("⏩ ×" + FF.toFixed(1), AX + AW - 120, AY + 43); g.globalAlpha = 1;
    }
    // captions
    g.setTransform(1, 0, 0, 1, 0, 0);
    for (const c of captions) if (VT >= c.s && VT < c.e) caption(c.text, c.y || AY + AH - 120);
    // ending card
    if (lastHomeVT !== null && VT > lastHomeVT + 0.5) {
      const a = Math.min(1, (VT - lastHomeVT - 0.5) / 0.6);
      g.globalAlpha = a * 0.86; g.fillStyle = BG; g.fillRect(AX, AY + 250, AW, 520); g.globalAlpha = a;
      g.strokeStyle = GOLD; g.lineWidth = 3; g.strokeRect(AX, AY + 250, AW, 520);
      glowText("ALL 100 REACHED 1.", W / 2, AY + 340, `900 56px ${FD}`, GOLD);
      glowText("THE COLLATZ CONJECTURE", W / 2, AY + 440, `900 44px ${FD}`, INK);
      g.font = `30px ${FM}`; g.fillStyle = INK; g.textAlign = "center";
      g.fillText("EVERY NUMBER CHECKED UP TO 2⁶⁸ REACHES 1", W / 2, AY + 530);
      g.fillStyle = GOLD; g.fillText("NOBODY HAS EVER PROVEN THEY ALL DO", W / 2, AY + 580);
      g.font = `24px ${FM}`; g.fillStyle = MUTED; g.fillText("ONE OF MATH'S MOST FAMOUS UNSOLVED PROBLEMS (1937)", W / 2, AY + 650);
      g.globalAlpha = 1;
    }
  }

  // Video time: once 80 balls are home, the long tail plays at 2.5× (shown on screen).
  function advanceVideo(dtv) {
    const target = homeCount >= 80 && lastHomeT === null ? 2.5 : 1;
    FF += (target - FF) * Math.min(1, dtv * 3);
    VT += dtv;
    if (lastHomeT !== null) { T += dtv; for (const b of balls) if (b.home && b.ht < 1) b.ht = Math.min(1, b.ht + dtv * 1.6); return; }
    const total = dtv * FF, n = Math.ceil(total / (1 / 30));
    for (let i = 0; i < n; i++) step(total / n);
  }
  // ---------- Render API (used by the MP4 renderer) ----------
  window.__collatz = {
    reset() { reset(); drawStatic(); },
    setCaptions(c) { captions = c; },
    advance(dt) { step(dt); },
    advanceVideo(dt) { advanceVideo(dt); },
    frame() { draw(); },
    info() { return { T, VT, homeCount, peak27T, lastHomeT, firstHomeT, peak27VT, lastHomeVT, FF }; },
    events() { return events; }
  };

  // ---------- Interactive mode (artifact / browser) ----------
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); view.style.width = Math.round(W * s) + "px"; view.style.height = Math.round(H * s) + "px"; }
  addEventListener("resize", fit); fit();
  let ac = null, master = null;
  function blip(f0, f1, dur, vol) {
    if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.004); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  let running = false, last = 0, evIdx = 0, lastSfx = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running) {
      advanceVideo(dt);
      const ev = events;
      for (; evIdx < ev.length; evIdx++) {
        const e = ev[evIdx];
        if (e.type === "home") blip(660 * Math.pow(2, (e.k % 12) / 12), 1320, 0.25, 0.2);
        else if (e.type === "peak27") blip(80, 40, 0.8, 0.6);
        else if (now - lastSfx > 40) { lastSfx = now; e.type === "up" ? blip(300, 600, 0.06, 0.05) : blip(500, 250, 0.06, 0.04); }
      }
    }
    draw(); requestAnimationFrame(loop);
  }
  function start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !ac) { ac = new AC(); master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); }
    if (ac && ac.state === "suspended") ac.resume();
    document.getElementById("startUi").hidden = true;
    reset(); evIdx = 0; running = true; last = performance.now();
    captions = [
      { s: 0.4, e: 7.0, text: "100 balls. Numbered 1 to 100." },
      { s: 7.2, e: 15.6, text: "Hit a wall: even → half. Odd → triple + 1." },
      { s: 15.8, e: 20, text: "Reach 1, and you're free." }
    ];
  }
  document.getElementById("startBtn").addEventListener("click", start);
  const boot = () => { reset(); drawStatic(); if (RENDER) { document.getElementById("startUi").hidden = true; draw(); } else { last = performance.now(); requestAnimationFrame(loop); } };
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`900 70px Orbitron`), document.fonts.load(`26px "Share Tech Mono"`)]).then(boot, boot); else boot();
})();
</script>
