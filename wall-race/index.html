<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall Breaker Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: one full-screen vertical canvas; its height follows the screen's shape so a recording has no bars. */
  :root {
    --bg: #05060a;
    --ink: #f4f6fb;
    --muted: #8a93a6;
    --yellow: #ffd60a;
    --blue: #19c3ff;
    --font-d: "Audiowide", "Arial Black", system-ui, sans-serif;
    --font-m: "Share Tech Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { overflow: hidden; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  body.running { cursor: none; }
  #view { display: block; background: var(--bg); touch-action: manipulation; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh); cursor: pointer;
    font-family: var(--font-m); text-align: center; line-height: 1.35;
  }
  .overlay p { margin: 0; }
  .tap {
    font: 20px/1 var(--font-d); letter-spacing: 0.06em; color: var(--bg); background: var(--yellow);
    border: 0; border-radius: 999px; padding: 16px 30px; cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 214, 10, 0.55);
  }
  .tap:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
  .note { font-size: 14px; color: var(--muted); max-width: 300px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view" width="1080" height="1920" aria-label="1 ball versus 1,000 balls wall breaking race"></canvas>
<div class="overlay" id="startUi">
  <button class="tap" id="startBtn" type="button">TAP TO START</button>
  <p class="note">Sound on. The race goes full screen, so start your screen recording first.</p>
</div>
<div class="overlay" id="endUi" hidden>
  <button class="tap" id="againBtn" type="button">RACE AGAIN</button>
</div>

<script>
(() => {
  "use strict";

  // ---------- Script (seconds of race time) ----------
  const TOTAL = 45;                                         // countdown length
  const HP = [25, 250, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000];
  // When each lane breaks each wall. Yellow is slow, then explodes and breaks wall 10 at 44.97 (0.03s left).
  const YELLOW_BREAKS = [13.0, 26.0, 33.0, 37.0, 39.6, 41.4, 42.7, 43.7, 44.45, 44.97];
  // Blue flies through 9 walls, then grinds on wall 10 and ends just short.
  const BLUE_BREAKS = [0.5, 1.5, 3.1, 5.3, 8.2, 12.0, 16.8, 22.8, 30.0, Infinity];
  const BLUE_LEFT_AT_END = 1407;                            // HP blue still needed
  const SLOWMO_FROM = 44.2, SLOWMO = 0.3;

  const YEL = "#ffd60a", BLU = "#19c3ff", BG = "#05060a", INK = "#f4f6fb", MUTED = "#8a93a6", RED = "#ff4b3a";
  const FD = '"Audiowide", "Arial Black", system-ui, sans-serif';
  const FM = '"Share Tech Mono", ui-monospace, Menlo, monospace';

  const params = new URLSearchParams(location.search);
  const SPEEDUP = Math.max(0.1, parseFloat(params.get("speed")) || 1);   // testing only

  // ---------- Canvas & layout ----------
  const W = 1080; let H = 1920;
  const view = document.getElementById("view");
  const g = view.getContext("2d");
  const G = {};
  const BALL_R = 7, CAP = 650;

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    H = Math.round(Math.min(2400, Math.max(1700, W * vh / vw)));
    view.width = W; view.height = H;
    const s = Math.min(vw / W, vh / H);
    view.style.width = Math.round(W * s) + "px";
    view.style.height = Math.round(H * s) + "px";
    const extra = H - 1920;                  // taller phones get more lane, not more header
    G.title1 = 150 + extra * 0.12; G.title2 = 258 + extra * 0.12;
    G.pill = 360 + extra * 0.14; G.timer = 470 + extra * 0.15;
    G.head = 585 + extra * 0.16;
    G.top = 650 + extra * 0.16; G.bottom = H - 70;
    G.sp = (G.bottom - G.top) / 11.2;
    G.wallY = HP.map((_, k) => G.top + G.sp * 1.4 + k * G.sp);
    G.laneW = 460;
    if (lanes) { lanes[0].x = 50; lanes[1].x = 570; }
  }

  // ---------- Glow sprites ----------
  function sprite(color) {
    const c = document.createElement("canvas"); c.width = c.height = 32;
    const x = c.getContext("2d"), gr = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.22, color); gr.addColorStop(0.45, color + "99"); gr.addColorStop(1, color + "00");
    x.fillStyle = gr; x.fillRect(0, 0, 32, 32); return c;
  }
  const SPR = { [YEL]: sprite(YEL), [BLU]: sprite(BLU) };

  // ---------- Audio ----------
  let ac = null, master = null, noise = null;
  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5;
    master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(type, f0, f1, dur, vol, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function hiss(dur, vol, freq, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when, n = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    n.buffer = noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.7;
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    n.connect(f); f.connect(gn); gn.connect(master); n.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const sHit = (L, strength) => tone("triangle", L.pitch * (0.95 + Math.random() * 0.1), L.pitch * 0.6, 0.06, 0.12 + 0.18 * strength);
  function sBreak(L) {
    tone("sine", 160, 45, 0.35, 0.8); hiss(0.3, 0.45, 1800);
    tone("square", L.pitch, L.pitch * 2, 0.12, 0.12, 0.03); tone("square", L.pitch * 1.5, L.pitch * 3, 0.12, 0.1, 0.09);
  }
  const sBeep = (hi) => tone("square", hi ? 1320 : 990, 0, 0.09, 0.18);
  const sHeart = () => { tone("sine", 70, 40, 0.18, 0.7); tone("sine", 65, 38, 0.16, 0.5, 0.17); };
  function sWin() {
    tone("sine", 120, 35, 0.6, 0.9); hiss(0.6, 0.5, 900);
    [523, 659, 784, 1047, 1319].forEach((f, i) => { tone("square", f, 0, 0.22, 0.1, 0.12 + i * 0.09); tone("triangle", f, 0, 0.5, 0.16, 0.12 + i * 0.09); });
    [1047, 1319, 1568].forEach((f) => tone("triangle", f, 0, 1.4, 0.12, 0.62));
  }

  // ---------- State ----------
  let lanes = null, t, state, winT, shake, lastBeep, nextHeart, endShown;
  const rand = (a, b) => a + Math.random() * (b - a);
  const fmt = (n) => Math.round(n).toLocaleString("en-US");

  function makeLane(o) {
    return Object.assign({ wall: 0, balls: [], frags: [], flash: 0, pop: 0, hitsNow: 0, lastSound: 0, frozen: false, pour: false, done: false }, o);
  }

  function newBall(L, x, y) {
    const a = rand(0, Math.PI * 2), sp = rand(650, 1100);
    return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, tr: [] };
  }

  function fillBalls(L) {
    const want = Math.min(CAP, L.count);
    const zoneBottom = L.wall < 10 ? G.wallY[L.wall] - 20 : G.bottom;
    while (L.balls.length < want) {
      const src = L.balls.length ? L.balls[(Math.random() * L.balls.length) | 0] : null;
      const x = src ? src.x + rand(-10, 10) : rand(L.x + 30, L.x + G.laneW - 30);
      const y = src ? src.y + rand(-10, 10) : rand(G.top + 20, zoneBottom);
      L.balls.push(newBall(L, x, y));
    }
  }

  function reset() {
    lanes = [
      makeLane({ name: "YELLOW", color: YEL, x: 50, count: 1, breaks: YELLOW_BREAKS, rule: "×5 / WALL", next: (n) => n * 5, pitch: 880 }),
      makeLane({ name: "BLUE", color: BLU, x: 570, count: 1000, breaks: BLUE_BREAKS, rule: "+1,000 / WALL", next: (n) => n + 1000, pitch: 587 })
    ];
    layout();
    for (const L of lanes) {
      L.hp = HP[0];
      if (L.count === 1) L.balls.push(newBall(L, L.x + G.laneW / 2, G.top + G.sp * 0.6));
      fillBalls(L);
    }
    t = 0; state = "ready"; winT = 0; shake = 0; lastBeep = 6; nextHeart = 0; endShown = false;
  }

  // HP the script says this lane's current wall should show at time t
  function scriptHP(L, time) {
    const k = L.wall; if (k >= 10) return 0;
    const start = k === 0 ? 0 : L.breaks[k - 1], end = L.breaks[k];
    if (end === Infinity) {
      const p = Math.min(1, Math.max(0, (time - start) / (YELLOW_BREAKS[9] - start)));
      return HP[k] - (HP[k] - BLUE_LEFT_AT_END) * p;
    }
    const p = Math.min(1, Math.max(0, (time - start) / (end - start)));
    return HP[k] * (1 - p);
  }

  function breakWall(L) {
    const k = L.wall, y = G.wallY[k];
    for (let i = 0; i < 16; i++) {
      L.frags.push({ x: L.x + (i + 0.5) * G.laneW / 16, y, len: rand(14, G.laneW / 16), vx: rand(-260, 260), vy: rand(-380, 120), a: rand(-0.4, 0.4), va: rand(-8, 8), life: 1 });
    }
    L.wall++; L.count = L.next(L.count); L.pop = 1; L.flash = 1; shake = Math.max(shake, 0.6);
    L.hp = L.wall < 10 ? HP[L.wall] : 0;
    fillBalls(L);
    sBreak(L);
    if (L.wall >= 10) { L.done = true; L.pour = true; win(); }
  }

  function win() {
    state = "won"; winT = 0; shake = 1.4;
    lanes[1].frozen = true;
    sWin();
  }

  function hit(L) {
    const s = scriptHP(L, t), dmg = L.count / L.balls.length;
    L.hp = Math.max(s, L.hp - dmg); L.hitsNow++; L.flash = Math.min(1, L.flash + 0.25);
  }

  function updateLane(L, dt) {
    if (L.frozen) return;
    const left = L.x + 4 + BALL_R, right = L.x + G.laneW - 4 - BALL_R, top = G.top + 4 + BALL_R;
    const bottom = L.wall < 10 ? G.wallY[L.wall] - 6 - BALL_R : Infinity;
    const trail = L.balls.length <= 30;
    L.hitsNow = 0;
    for (const o of L.balls) {
      if (trail) { o.tr.push(o.x, o.y); if (o.tr.length > 16) o.tr.splice(0, 2); } else if (o.tr.length) o.tr.length = 0;
      if (L.pour) o.vy += 2600 * dt;
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.x < left) { o.x = left; o.vx = Math.abs(o.vx); }
      if (o.x > right) { o.x = right; o.vx = -Math.abs(o.vx); }
      if (o.y < top) { o.y = top; o.vy = Math.abs(o.vy); }
      if (o.y > bottom) {
        o.y = bottom; o.vy = -Math.abs(o.vy);
        const c = Math.cos(rand(-0.25, 0.25)), s2 = Math.sin(rand(-0.25, 0.25)), vx = o.vx;
        o.vx = vx * c - o.vy * s2; o.vy = vx * s2 + o.vy * c;
        if (state === "run") hit(L);
      }
      if (L.pour && o.y > H + 30) { o.x = rand(left, right); o.y = rand(top, top + G.sp * 2); o.vy = rand(-200, 300); o.tr.length = 0; }
    }
    if (state === "run" && L.wall < 10) {
      const s = scriptHP(L, t), slack = 2 * L.count / Math.max(1, L.balls.length);
      L.hp = Math.min(L.hp, s + slack);
      if (L.hitsNow) {
        const now = performance.now(), gap = L.balls.length < 4 ? 0 : 45;
        if (now - L.lastSound > gap) { L.lastSound = now; sHit(L, Math.min(1, L.hitsNow / 20)); }
      }
    }
    for (let i = L.frags.length - 1; i >= 0; i--) {
      const f = L.frags[i]; f.vy += 1400 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt; f.life -= dt * 0.9;
      if (f.life <= 0) L.frags.splice(i, 1);
    }
    L.flash = Math.max(0, L.flash - dt * 4); L.pop = Math.max(0, L.pop - dt * 2.5);
  }

  function update(realDt) {
    if (state === "run") {
      const scale = (t >= SLOWMO_FROM ? SLOWMO : 1) * SPEEDUP;
      let dt = realDt * scale;
      const yl = lanes[0];
      if (!yl.done && t + dt > YELLOW_BREAKS[9]) dt = YELLOW_BREAKS[9] - t;   // land exactly on 44.97
      t += dt;
      for (const L of lanes) while (state === "run" && L.wall < 10 && t >= L.breaks[L.wall]) breakWall(L);
      for (const L of lanes) updateLane(L, dt);
      const left = TOTAL - t;
      if (state === "run" && left <= 5 && Math.ceil(left) < lastBeep) { lastBeep = Math.ceil(left); sBeep(lastBeep <= 1); }
      if (state === "run" && t >= SLOWMO_FROM) {
        nextHeart -= realDt; if (nextHeart <= 0) { nextHeart = 0.55; sHeart(); }
      }
    } else if (state === "won") {
      winT += realDt;
      for (const L of lanes) updateLane(L, realDt);
      if (winT > 4 && !endShown) { endShown = true; document.getElementById("endUi").hidden = false; document.body.classList.remove("running"); }
    } else {
      for (const L of lanes) updateLane(L, realDt * 0.5);
    }
    shake = Math.max(0, shake - realDt * 2.2);
  }

  // ---------- Drawing ----------
  function glowText(txt, x, y, font, color, blur, align = "center") {
    g.font = font; g.textAlign = align; g.textBaseline = "middle";
    g.shadowColor = color; g.shadowBlur = blur; g.fillStyle = color; g.fillText(txt, x, y);
    g.shadowBlur = blur * 0.4; g.fillText(txt, x, y); g.shadowBlur = 0;
  }
  function neonLine(x1, y1, x2, y2, color, w, blur) {
    g.strokeStyle = color; g.lineWidth = w; g.lineCap = "round";
    g.shadowColor = color; g.shadowBlur = blur;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.shadowBlur = 0;
  }
  function roundRect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function drawHeader() {
    glowText("WHO BREAKS", W / 2, G.title1, `86px ${FD}`, INK, 26);
    glowText("ALL 10 WALLS?", W / 2, G.title2, `86px ${FD}`, INK, 26);
    // pill
    const pw = 780, ph = 74, px = (W - pw) / 2, py = G.pill - ph / 2;
    g.strokeStyle = INK; g.lineWidth = 4; g.shadowColor = INK; g.shadowBlur = 14;
    roundRect(px, py, pw, ph, ph / 2); g.stroke(); g.shadowBlur = 0;
    g.fillStyle = YEL; g.beginPath(); g.arc(px + 52, G.pill, 13, 0, 7); g.fill();
    g.fillStyle = BLU; g.beginPath(); g.arc(px + 88, G.pill, 13, 0, 7); g.fill();
    g.font = `34px ${FD}`; g.fillStyle = INK; g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText("PICK ONE BEFORE TIME RUNS OUT", px + 118, G.pill + 2);
    // timer
    const left = Math.max(0, TOTAL - t);
    let col = INK;
    if (state === "won") col = (Math.floor(winT * 4) % 2 === 0) ? YEL : INK;
    else if (left <= 5 && state === "run") col = RED;
    glowText(left.toFixed(2), W / 2, G.timer, `120px ${FM}`, col, 24);
    g.font = `22px ${FM}`; g.fillStyle = MUTED; g.textAlign = "center";
    g.fillText("SECONDS LEFT", W / 2, G.timer + 62);
  }

  function drawLane(L) {
    const x = L.x, w = G.laneW, dim = L.frozen ? 0.45 : 1;
    // header
    const sc = 1 + L.pop * 0.18, countTxt = fmt(L.count);
    g.font = `64px ${FD}`;
    const size = Math.floor(64 * Math.min(1, (w - 215) / g.measureText(countTxt).width));
    g.save(); g.translate(x, G.head); g.scale(sc, sc);
    glowText(countTxt, 0, 0, `${size}px ${FD}`, L.color, 22, "left");
    g.restore();
    g.font = `26px ${FM}`; g.textAlign = "right"; g.textBaseline = "middle";
    g.fillStyle = L.color; g.fillText(L.rule, x + w, G.head - 18);
    g.fillStyle = MUTED; g.fillText(`WALL ${Math.min(10, L.wall + 1)}/10`, x + w, G.head + 16);

    g.globalAlpha = dim;
    // lane frame
    neonLine(x, G.top, x + w, G.top, L.color, 5, 18);
    neonLine(x, G.top, x, G.bottom, L.color, 5, 18);
    neonLine(x + w, G.top, x + w, G.bottom, L.color, 5, 18);
    // finish band
    const cs = 15, rows = 2, cols = Math.floor(w / cs);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      g.fillStyle = (r + c) % 2 ? "#1b1e27" : (L.done ? L.color : "#d9dce4");
      g.fillRect(x + c * cs + (w - cols * cs) / 2, G.bottom - rows * cs + r * cs, cs, cs);
    }
    // walls
    for (let k = L.wall; k < 10; k++) {
      const y = G.wallY[k], cur = k === L.wall;
      const lw = cur ? 8 + L.flash * 4 : 5;
      neonLine(x + 2, y, x + w - 2, y, cur && L.flash > 0.3 ? "#ffffff" : L.color, lw, cur ? 22 + L.flash * 20 : 12);
      const hp = cur ? Math.ceil(L.hp) : HP[k];
      const label = fmt(hp);
      g.font = `${cur ? 34 : 26}px ${FM}`;
      const tw = g.measureText(label).width + 26, th = cur ? 44 : 34;
      g.fillStyle = BG; roundRect(x + w / 2 - tw / 2, y - th / 2, tw, th, 8); g.fill();
      g.strokeStyle = L.color; g.lineWidth = 2; g.stroke();
      g.fillStyle = cur ? "#ffffff" : L.color; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(label, x + w / 2, y + 2);
      if (cur) {   // HP bar under the current wall
        const p = Math.max(0, Math.min(1, L.hp / HP[k])), bw = w - 40;
        g.fillStyle = "#1b1e27"; g.fillRect(x + 20, y + 26, bw, 6);
        g.fillStyle = L.color; g.fillRect(x + 20, y + 26, bw * p, 6);
      }
    }
    // fragments
    for (const f of L.frags) {
      g.globalAlpha = Math.max(0, f.life) * dim;
      g.save(); g.translate(f.x, f.y); g.rotate(f.a);
      neonLine(-f.len / 2, 0, f.len / 2, 0, L.color, 6, 14);
      g.restore();
    }
    g.globalAlpha = dim;
    // balls
    const spr = SPR[L.color], S = BALL_R * 3.8;
    g.save(); g.beginPath(); g.rect(x + 2, G.top + 2, w - 4, H); g.clip();
    for (const o of L.balls) {
      if (o.tr.length > 2) {
        g.strokeStyle = L.color; g.lineCap = "round";
        for (let i = 2; i < o.tr.length; i += 2) {
          g.globalAlpha = dim * (i / o.tr.length) * 0.5; g.lineWidth = BALL_R * 1.4 * (i / o.tr.length);
          g.beginPath(); g.moveTo(o.tr[i - 2], o.tr[i - 1]); g.lineTo(o.tr[i], o.tr[i + 1]); g.stroke();
        }
        g.globalAlpha = dim;
      }
      g.drawImage(spr, o.x - S / 2, o.y - S / 2, S, S);
    }
    g.restore();
    g.globalAlpha = 1;
  }

  function drawWin() {
    const a = Math.min(1, winT / 0.3);
    const cy = G.top + (G.bottom - G.top) * 0.42, bh = 330;
    g.globalAlpha = a * 0.88; g.fillStyle = BG; g.fillRect(0, cy - bh / 2, W, bh); g.globalAlpha = a;
    neonLine(0, cy - bh / 2, W, cy - bh / 2, YEL, 4, 18);
    neonLine(0, cy + bh / 2, W, cy + bh / 2, YEL, 4, 18);
    const s = 1 + Math.max(0, 0.35 - winT) * 1.6;
    g.save(); g.translate(W / 2, cy - 70); g.scale(s, s);
    glowText("YELLOW WINS!", 0, 0, `96px ${FD}`, YEL, 34);
    g.restore();
    glowText("1 BALL BROKE THROUGH WITH 0.03s LEFT", W / 2, cy + 30, `36px ${FM}`, INK, 10);
    glowText(`BLUE WAS ${fmt(Math.ceil(lanes[1].hp))} HP SHORT`, W / 2, cy + 92, `34px ${FM}`, BLU, 12);
    g.globalAlpha = 1;
  }

  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = BG; g.fillRect(0, 0, W, H);
    // faint grid
    g.strokeStyle = "rgba(255,255,255,0.035)"; g.lineWidth = 1;
    for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    const sx = rand(-1, 1) * shake * 14, sy = rand(-1, 1) * shake * 14;
    g.setTransform(1, 0, 0, 1, sx, sy);
    drawHeader();
    for (const L of lanes) drawLane(L);
    if (state === "won") drawWin();
    // slow-motion vignette
    if (state === "run" && t >= SLOWMO_FROM) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      const vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.6)");
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop & controls ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  function start() {
    initAudio(); if (ac && ac.state === "suspended") ac.resume();
    const el = document.documentElement;
    try { const p = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    document.getElementById("startUi").hidden = true;
    document.getElementById("endUi").hidden = true;
    document.body.classList.add("running");
    reset(); state = "run"; last = performance.now();
  }
  document.getElementById("startUi").addEventListener("click", start);
  document.getElementById("endUi").addEventListener("click", start);
  window.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && state !== "run") { e.preventDefault(); start(); }
  });
  window.addEventListener("resize", () => { layout(); });
  document.addEventListener("fullscreenchange", layout);

  reset();
  window.__race = { get t() { return t; }, get state() { return state; }, get lanes() { return lanes; }, start };
  const go = () => requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`86px Audiowide`), document.fonts.load(`40px "Share Tech Mono"`)]).then(go, go);
  else go();
})();
</script>
</body>
</html>
