<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Made With Claude</title>
    <link rel="icon" href="data:," />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/build-stats.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face {
        font-family: "MWC Display";
        font-weight: 700;
        src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "MWC Display";
        font-weight: 500;
        src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "MWC Mono";
        font-weight: 400;
        src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "MWC Mono";
        font-weight: 700;
        src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
      }
      :root {
        --ground: #0b0b0f;
        --ink: #f4f4f6;
        --accent: #00e5ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      #overlays {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #tagline {
        position: absolute;
        left: 50%;
        top: 742px;
        transform: translateX(-50%);
        font: 500 46px/1.2 "MWC Display", sans-serif;
        letter-spacing: -0.01em;
        color: var(--ink);
        opacity: 0;
        white-space: pre;
      }
      #tagline .cursor {
        display: inline-block;
        width: 0.5em;
        height: 0.95em;
        margin-left: 0.08em;
        vertical-align: -0.12em;
        background: var(--accent);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: var(--ink);
        opacity: 0;
      }
      #black {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="stage" class="clip" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics"></canvas>
      <div id="overlays" class="clip" data-start="0" data-duration="60" data-track-index="1" data-track-kind="graphics">
        <div id="tagline"><span class="text"></span><span class="cursor"></span></div>
        <div id="flash"></div>
        <div id="black"></div>
      </div>
      <!-- Sound layer: tools/sound.mjs places every cue from the beat map in timeline/timing.js. -->
      <audio id="sfx-mix" class="clip" src="assets/audio/mix.m4a" data-start="0" data-duration="60" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      // Seekable root timeline. All motion is computed in renderAt(t) from timeline time
      // (the hf-seek protocol for WebGL); this timeline only fixes the film's length.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["main"] = new Promise((resolve, reject) => {
        window.__mwcReady = resolve;
        window.__mwcFail = reject;
      });
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 60);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="timeline/main.js"></script>
  </body>
</html>
