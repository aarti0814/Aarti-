<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibonacci vs Googol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: one full-screen vertical canvas (HUD style); its height follows the screen so recordings have no bars. */
  :root {
    --bg: #04060c;
    --ink: #eaf6ff;
    --muted: #7d8aa3;
    --cyan: #2de2ff;
    --gold: #ffc83d;
    --font-d: "Orbitron", "Arial Black", system-ui, sans-serif;
    --font-m: "Share Tech Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { overflow: hidden; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  body.running { cursor: none; }
  #view { display: block; background: var(--bg); touch-action: manipulation; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh); cursor: pointer;
    font-family: var(--font-m); text-align: center; line-height: 1.35;
  }
  .overlay p { margin: 0; font-size: 14px; color: var(--muted); max-width: 300px; }
  .tap {
    font: 900 17px/1 var(--font-d); letter-spacing: 0.1em; color: var(--bg); background: var(--cyan);
    border: 0; border-radius: 6px; padding: 16px 28px; cursor: pointer; box-shadow: 0 0 22px rgba(45, 226, 255, 0.5);
  }
  .tap:disabled { background: #2a3142; color: var(--muted); box-shadow: none; cursor: progress; }
  .tap:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view" width="1080" height="1920" aria-label="Fibonacci ball versus a 1 googol HP ball"></canvas>
<div class="overlay" id="startUi">
  <button class="tap" id="startBtn" type="button" disabled>LOADING…</button>
  <p>Sound on. It goes full screen, so start your screen recording first.</p>
</div>
<div class="overlay" id="endUi" hidden>
  <button class="tap" id="againBtn" type="button">RUN IT AGAIN</button>
</div>

<script>
(() => {
  "use strict";

  // =====================================================================
  // Physics: a square, a giant ball and a small ball. Every time the small
  // ball hits the giant one it deals the next Fibonacci number of damage
  // and speeds up a little. Seeded + fixed timestep = repeatable.
  // =====================================================================
  // SIM-START
  const FSIM = (() => {
    const DT = 1 / 720, SIDE = 940, BOSS_R = 300, BALL_R = 26, BOSS_MASS = 40;
    function rng32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function create(seed, opt) {
      const rnd = rng32(seed), rr = (a, b) => a + rnd() * (b - a);
      const ev = [];
      const ba = rr(0, 6.2832), bo = rr(0, 6.2832);
      const boss = { x: SIDE / 2 + rr(-60, 60), y: SIDE / 2 + rr(-60, 60), vx: Math.cos(bo) * opt.bossSpeed, vy: Math.sin(bo) * opt.bossSpeed, r: BOSS_R };
      const ball = { x: 80, y: 80, vx: Math.cos(ba) * opt.speed0, vy: Math.sin(ba) * opt.speed0, r: BALL_R, speed: opt.speed0 };
      const sim = { t: 0, hits: 0, boss, ball, ev, step() {
        sim.t += DT;
        for (const o of [boss, ball]) {
          o.x += o.vx * DT; o.y += o.vy * DT;
          const lo = o.r, hi = SIDE - o.r;
          if (o.x < lo) { o.x = lo; o.vx = Math.abs(o.vx); if (o === ball) ev.push(1, o.x, o.y); }
          else if (o.x > hi) { o.x = hi; o.vx = -Math.abs(o.vx); if (o === ball) ev.push(1, o.x, o.y); }
          if (o.y < lo) { o.y = lo; o.vy = Math.abs(o.vy); if (o === ball) ev.push(1, o.x, o.y); }
          else if (o.y > hi) { o.y = hi; o.vy = -Math.abs(o.vy); if (o === ball) ev.push(1, o.x, o.y); }
        }
        const dx = ball.x - boss.x, dy = ball.y - boss.y, d = Math.hypot(dx, dy), min = boss.r + ball.r;
        if (d < min && d > 1e-6) {
          const nx = dx / d, ny = dy / d, ov = min - d;
          const mb = BOSS_MASS, m = 1, tot = mb + m;
          ball.x += nx * ov * mb / tot; ball.y += ny * ov * mb / tot;
          boss.x -= nx * ov * m / tot; boss.y -= ny * ov * m / tot;
          const rv = (ball.vx - boss.vx) * nx + (ball.vy - boss.vy) * ny;
          if (rv < 0) {
            const j = -2 * rv / (1 / m + 1 / mb);
            ball.vx += j * nx / m; ball.vy += j * ny / m;
            boss.vx -= j * nx / mb; boss.vy -= j * ny / mb;
            ball.speed = Math.min(opt.maxSpeed, ball.speed * opt.grow);
            const a = Math.atan2(ball.vy, ball.vx) + rr(-0.18, 0.18);
            ball.vx = Math.cos(a) * ball.speed; ball.vy = Math.sin(a) * ball.speed;
            const bs = Math.hypot(boss.vx, boss.vy) || 1, k = Math.min(1, opt.bossMax / bs);
            boss.vx *= k; boss.vy *= k;
            sim.hits++; ev.push(2, ball.x - nx * ball.r, ball.y - ny * ball.r);
          }
        }
      } };
      return sim;
    }
    return { create, DT, SIDE, BOSS_R, BALL_R };
  })();
  // SIM-END

  const OPT = { speed0: 1400, grow: 1.022, maxSpeed: 15000, bossSpeed: 90, bossMax: 160 };
  const LIMIT = 60;
  const GOOGOL = 10n ** 100n;

  // Exact Fibonacci damage table (BigInt) and how many hits a googol takes.
  const FIB = [0n, 1n, 1n];
  const TOTAL = [0n, 1n, 2n];
  while (TOTAL[TOTAL.length - 1] < GOOGOL) {
    const n = FIB.length; FIB.push(FIB[n - 1] + FIB[n - 2]); TOTAL.push(TOTAL[n - 1] + FIB[n]);
  }
  const KILL_HITS = TOTAL.length - 1;             // 479

  // Find a seed where the killing hit lands just before the 60 s mark.
  const PREFERRED = [22, 23, 25, 37, 38, 13, 2];
  function killTime(seed) {
    const s = FSIM.create(seed, OPT);
    while (s.hits < KILL_HITS && s.t < 70) { s.step(); s.ev.length = 0; }
    return s.hits >= KILL_HITS ? s.t : Infinity;
  }
  let SEED = null, KILL_T = 0;
  function prepare(i = 0) {
    for (let n = 0; n < 6; n++, i++) {
      const seed = i < PREFERRED.length ? PREFERRED[i] : 100 + i;
      const t = killTime(seed);
      if (t >= 58.6 && t <= 59.85) { SEED = seed; KILL_T = t; return ready(); }
      if (i > 600) { SEED = PREFERRED[0]; KILL_T = killTime(SEED); return ready(); }
    }
    setTimeout(() => prepare(i), 0);
  }

  // ---------- Look ----------
  const BG = "#04060c", INK = "#eaf6ff", MUTED = "#7d8aa3", CYAN = "#2de2ff", GOLD = "#ffc83d", RED = "#ff3b2f", ORANGE = "#ff8a1f";
  const FD = '"Orbitron", "Arial Black", system-ui, sans-serif';
  const FM = '"Share Tech Mono", ui-monospace, Menlo, monospace';
  const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  const sup = (n) => String(n).split("").map((c) => SUP[+c]).join("");
  const commas = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  function sci(big, dec = 3) {             // BigInt -> "1.234×10⁴⁵", properly rounded (plain with commas if short)
    const s = big.toString();
    if (s.length <= 12) return commas(s);
    let exp = s.length - 1, m = Math.round(Number(s.slice(0, 16)) / 10 ** (15 - dec)) / 10 ** dec;
    if (m >= 10) { m /= 10; exp++; }
    return m.toFixed(dec) + "×10" + sup(exp);
  }

  // ---------- Canvas & layout ----------
  const W = 1080; let H = 1920;
  const view = document.getElementById("view");
  const g = view.getContext("2d", { alpha: false });
  const stat = document.createElement("canvas"), sg = stat.getContext("2d");
  const L = {};
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    H = Math.round(Math.min(2400, Math.max(1760, W * vh / vw)));
    view.width = stat.width = W; view.height = stat.height = H;
    const s = Math.min(vw / W, vh / H);
    view.style.width = Math.round(W * s) + "px"; view.style.height = Math.round(H * s) + "px";
    const ex = H - 1920;
    L.t1 = 118 + ex * 0.15; L.t2 = 196 + ex * 0.15; L.t3 = 274 + ex * 0.15;
    L.timer = 372 + ex * 0.22;
    L.sx = 70; L.sy = 450 + ex * 0.3; L.side = FSIM.SIDE;
    L.panel = L.sy + L.side + 50 + ex * 0.15;
    drawStatic();
  }
  function drawStatic() {
    const c = sg;
    c.fillStyle = BG; c.fillRect(0, 0, W, H);
    const vg = c.createRadialGradient(W / 2, L.sy + 470, 100, W / 2, L.sy + 470, H * 0.8);
    vg.addColorStop(0, "#0a1426"); vg.addColorStop(1, BG); c.fillStyle = vg; c.fillRect(0, 0, W, H);
    // title
    const lines = [
      [["CAN A ", INK], ["FIBONACCI", GOLD], [" BALL", INK]],
      [["DEAL ", INK], ["1 GOOGOL", CYAN], [" DAMAGE", INK]],
      [["IN 60 SECONDS?", INK]]
    ];
    const ys = [L.t1, L.t2, L.t3];
    c.font = `900 60px ${FD}`; c.textBaseline = "middle"; c.textAlign = "left";
    lines.forEach((parts, i) => {
      const w = parts.reduce((a, [t]) => a + c.measureText(t).width, 0);
      let x = (W - w) / 2;
      for (const [t, col] of parts) {
        c.shadowColor = col; c.shadowBlur = 22; c.fillStyle = col; c.fillText(t, x, ys[i]);
        c.shadowBlur = 6; c.fillText(t, x, ys[i]); c.shadowBlur = 0;
        x += c.measureText(t).width;
      }
    });
    c.font = `20px ${FM}`; c.fillStyle = MUTED; c.textAlign = "center";
    c.fillText("SECONDS LEFT", W / 2, L.timer + 52);
    // arena: faint grid + neon frame with HUD corners
    const x0 = L.sx, y0 = L.sy, sd = L.side;
    c.fillStyle = "rgba(45,226,255,0.035)"; c.fillRect(x0, y0, sd, sd);
    c.strokeStyle = "rgba(45,226,255,0.07)"; c.lineWidth = 1;
    for (let k = 47; k < sd; k += 47) {
      c.beginPath(); c.moveTo(x0 + k + 0.5, y0); c.lineTo(x0 + k + 0.5, y0 + sd); c.stroke();
      c.beginPath(); c.moveTo(x0, y0 + k + 0.5); c.lineTo(x0 + sd, y0 + k + 0.5); c.stroke();
    }
    c.strokeStyle = CYAN; c.lineWidth = 4; c.shadowColor = CYAN; c.shadowBlur = 20;
    c.strokeRect(x0, y0, sd, sd); c.shadowBlur = 0;
    c.lineWidth = 8; c.lineCap = "square";
    for (const [cx, cy, dx, dy] of [[x0, y0, 1, 1], [x0 + sd, y0, -1, 1], [x0, y0 + sd, 1, -1], [x0 + sd, y0 + sd, -1, -1]]) {
      c.beginPath(); c.moveTo(cx - dx * 14, cy + dy * 46); c.lineTo(cx - dx * 14, cy - dy * 14); c.lineTo(cx + dx * 46, cy - dy * 14); c.stroke();
    }
    c.font = `18px ${FM}`; c.fillStyle = CYAN; c.textAlign = "left";
    c.fillText("ARENA 01", x0 + 40, y0 - 32); c.textAlign = "right"; c.fillText("F(n) = F(n-1) + F(n-2)", x0 + sd - 40, y0 - 32);
  }

  // ---------- Audio ----------
  let ac = null, master = null, noise = null;
  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5;
    master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(type, f0, f1, dur, vol, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.004); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function hiss(dur, vol, freq, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when, n = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    n.buffer = noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.7;
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    n.connect(f); f.connect(gn); gn.connect(master); n.start(t, Math.random() * 0.5, dur + 0.05);
  }
  // Hit pitch climbs with the hit number: the sound rises as the numbers explode.
  const sHit = (n) => { const f = 180 * Math.pow(2, Math.min(4.2, n / 110)); tone("triangle", f, f * 0.7, 0.07, 0.22); tone("square", f * 2, 0, 0.03, 0.05); };
  const sWall = () => tone("sine", 120, 70, 0.05, 0.12);
  const sBig = () => { tone("sine", 110, 40, 0.5, 0.9); hiss(0.4, 0.4, 1200); };
  const sBeep = (hi) => tone("square", hi ? 1320 : 990, 0, 0.09, 0.16);
  function sWin() {
    tone("sine", 90, 30, 1.2, 1); hiss(1.0, 0.6, 700); hiss(0.6, 0.4, 3000, 0.05);
    [392, 494, 587, 784, 988, 1175].forEach((f, i) => { tone("square", f, 0, 0.25, 0.08, 0.35 + i * 0.08); tone("triangle", f, 0, 0.6, 0.15, 0.35 + i * 0.08); });
    [784, 988, 1175, 1568].forEach((f) => tone("triangle", f, 0, 1.8, 0.1, 0.85));
  }

  // ---------- Live state ----------
  let sim = null, state = "loading", acc = 0, hpBig = GOOGOL, dealt = 0n, lastDmg = 0n;
  let flash = 0, shake = 0, endT = 0, lastBeep = 6, lastHitSound = 0, lastWallSound = 0, endShown = false;
  const trail = [], sparks = [], pops = [], shards = [];
  const rand = (a, b) => a + Math.random() * (b - a);

  function newRun() {
    sim = FSIM.create(SEED, OPT);
    acc = 0; hpBig = GOOGOL; dealt = 0n; lastDmg = 0n; flash = 0; shake = 0; endT = 0; lastBeep = 6; endShown = false;
    trail.length = 0; sparks.length = 0; pops.length = 0; shards.length = 0;
  }

  function onHit(x, y) {
    const n = sim.hits;
    lastDmg = FIB[n]; dealt = TOTAL[n]; hpBig = dealt >= GOOGOL ? 0n : GOOGOL - dealt;
    const digits = lastDmg.toString().length;
    flash = Math.min(1, flash + 0.35 + digits / 200);
    shake = Math.max(shake, n > KILL_HITS - 4 ? 1 : 0.15 + digits / 250);
    const sx = L.sx + x, sy = L.sy + y;
    const cnt = Math.min(14, 3 + (digits >> 3));
    if (sparks.length < 400) for (let i = 0; i < cnt; i++) { const a = rand(0, 6.283), v = rand(150, 650); sparks.push({ x: sx, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.6) }); }
    if (pops.length > 3) pops.shift();
    pops.push({ x: sx, y: sy, txt: "+" + sci(lastDmg, 2), life: 1, big: n > KILL_HITS - 4 });
    const now = performance.now();
    if (n > KILL_HITS - 4) sBig();
    else if (now - lastHitSound > 28) { lastHitSound = now; sHit(n); }
    if (n >= KILL_HITS) kill();
  }

  function kill() {
    state = "won"; endT = 0; shake = 1.6; flash = 1;
    const b = sim.boss, cx = L.sx + b.x, cy = L.sy + b.y;
    for (let i = 0; i < 70; i++) {
      const a = rand(0, 6.283), v = rand(200, 1300);
      shards.push({ x: cx + Math.cos(a) * rand(0, 200), y: cy + Math.sin(a) * rand(0, 200), vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rand(10, 34), a: rand(0, 6), va: rand(-8, 8), c: Math.random() < 0.5 ? RED : ORANGE, life: 1 });
    }
    for (let i = 0; i < 160; i++) { const a = rand(0, 6.283), v = rand(300, 1600); sparks.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 1.2) }); }
    sWin();
  }

  function update(dt) {
    if (state === "run") {
      const near = sim.hits >= KILL_HITS - 3;
      acc += dt * (near ? 0.22 : 1);
      let n = 0;
      while (acc >= FSIM.DT && n < 80 && state === "run") {
        sim.step(); acc -= FSIM.DT; n++;
        trail.push(sim.ball.x, sim.ball.y); if (trail.length > 120) trail.splice(0, 2);
        const ev = sim.ev;
        for (let j = 0; j < ev.length; j += 3) {
          if (ev[j] === 2) onHit(ev[j + 1], ev[j + 2]);
          else { const now = performance.now(); if (now - lastWallSound > 70) { lastWallSound = now; sWall(); } }
        }
        ev.length = 0;
      }
      const left = LIMIT - sim.t;
      if (state === "run" && left <= 5 && Math.ceil(left) < lastBeep) { lastBeep = Math.ceil(left); sBeep(lastBeep <= 1); }
    } else if (state === "won") {
      endT += dt;
      if (endT > 4.5 && !endShown) { endShown = true; document.getElementById("endUi").hidden = false; document.body.classList.remove("running"); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; if (p.life <= 0) sparks.splice(i, 1); }
    for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 70 * dt; p.life -= dt * (p.big ? 0.5 : 1.2); if (p.life <= 0) pops.splice(i, 1); }
    for (let i = shards.length - 1; i >= 0; i--) { const s = shards[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.97; s.vy *= 0.97; s.a += s.va * dt; s.life -= dt * 0.35; if (s.life <= 0) shards.splice(i, 1); }
    flash = Math.max(0, flash - dt * 5); shake = Math.max(0, shake - dt * 2.5);
  }

  // ---------- Drawing (glow via layered strokes; no shadowBlur per frame) ----------
  function glowText(t, x, y, font, col, align = "center", strong = 1) {
    g.font = font; g.textAlign = align; g.textBaseline = "middle"; g.strokeStyle = col; g.lineJoin = "round";
    g.globalAlpha = 0.14 * strong; g.lineWidth = 16; g.strokeText(t, x, y);
    g.globalAlpha = 0.28 * strong; g.lineWidth = 7; g.strokeText(t, x, y);
    g.globalAlpha = 1; g.fillStyle = col; g.fillText(t, x, y);
  }
  function drawBoss() {
    const b = sim.boss, x = L.sx + b.x, y = L.sy + b.y, r = b.r;
    const frac = Number((hpBig * 10000n) / GOOGOL) / 10000;           // linear HP left
    const digits = dealt === 0n ? 0 : dealt.toString().length;          // progress in digits
    // body
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    gr.addColorStop(0, "#ff7a3d"); gr.addColorStop(0.45, "#c4211a"); gr.addColorStop(1, "#3a0707");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
    // hex-ish armour lines
    g.strokeStyle = "rgba(255,180,120,0.18)"; g.lineWidth = 2;
    for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(x, y, r * k / 4, 0, 6.2832); g.stroke(); }
    // cracks appear as real HP finally drops
    if (frac < 0.999) {
      g.strokeStyle = "rgba(255,230,180,0.85)"; g.lineWidth = 4;
      const n = Math.ceil((1 - frac) * 14);
      for (let k = 0; k < n; k++) {
        const a = k * 2.399; let px = x, py = y;
        g.beginPath(); g.moveTo(px, py);
        for (let s = 1; s <= 4; s++) { const rr = r * s / 4.2, aa = a + Math.sin(k * 7 + s) * 0.25; px = x + Math.cos(aa) * rr; py = y + Math.sin(aa) * rr; g.lineTo(px, py); }
        g.stroke();
      }
    }
    if (flash > 0) { g.globalAlpha = flash * 0.55; g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); g.globalAlpha = 1; }
    // HP ring (linear) and digit-progress ring
    g.lineCap = "round";
    g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 12; g.beginPath(); g.arc(x, y, r - 14, 0, 6.2832); g.stroke();
    g.strokeStyle = "#ffffff"; g.globalAlpha = 0.25; g.lineWidth = 20; g.beginPath(); g.arc(x, y, r - 14, -Math.PI / 2, -Math.PI / 2 + 6.2832 * frac); g.stroke();
    g.globalAlpha = 1; g.strokeStyle = "#ffe0d0"; g.lineWidth = 9; g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 6; g.beginPath(); g.arc(x, y, r - 36, 0, 6.2832); g.stroke();
    g.strokeStyle = GOLD; g.lineWidth = 6; g.beginPath(); g.arc(x, y, r - 36, -Math.PI / 2, -Math.PI / 2 + 6.2832 * digits / 101); g.stroke();
    // label
    g.fillStyle = "rgba(255,255,255,0.75)"; g.font = `600 24px ${FD}`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("HP", x, y - 62);
    const hpTxt = hpBig === 0n ? "0" : sci(hpBig, 4);
    glowText(hpTxt, x, y - 8, `54px ${FM}`, "#ffffff");
    g.fillStyle = "rgba(255,255,255,0.6)"; g.font = `20px ${FM}`;
    g.fillText("1 GOOGOL = 10" + sup(100), x, y + 46);
  }
  function drawBall() {
    const b = sim.ball, R = b.r;
    // light trail from the last substep positions (bends at every bounce)
    g.strokeStyle = GOLD; g.lineCap = "round"; g.lineJoin = "round";
    const n = trail.length / 2;
    for (let i = 1; i < n; i++) {
      const f = i / n; g.globalAlpha = f * 0.55; g.lineWidth = R * 1.6 * f;
      g.beginPath(); g.moveTo(L.sx + trail[(i - 1) * 2], L.sy + trail[(i - 1) * 2 + 1]); g.lineTo(L.sx + trail[i * 2], L.sy + trail[i * 2 + 1]); g.stroke();
    }
    g.globalAlpha = 1;
    const x = L.sx + b.x, y = L.sy + b.y;
    g.fillStyle = GOLD; g.globalAlpha = 0.25; g.beginPath(); g.arc(x, y, R * 2, 0, 6.2832); g.fill();
    g.globalAlpha = 1; g.beginPath(); g.arc(x, y, R, 0, 6.2832); g.fill();
    g.fillStyle = "#fff8de"; g.beginPath(); g.arc(x - 7, y - 8, 8, 0, 6.2832); g.fill();
    g.fillStyle = "#3a2600"; g.font = `900 22px ${FD}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("F", x + 1, y + 2);
  }
  function drawPanel() {
    const y = L.panel, x0 = L.sx, x1 = L.sx + L.side;
    const n = sim.hits;
    g.textBaseline = "middle";
    glowText(`HIT #${n}`, x0, y, `900 40px ${FD}`, GOLD, "left");
    g.font = `22px ${FM}`; g.fillStyle = MUTED; g.textAlign = "right"; g.fillText(n ? `F(${n}) THIS HIT` : "F(1) NEXT", x1, y - 16);
    glowText(n ? sci(lastDmg, 3) : "1", x1, y + 16, `32px ${FM}`, INK, "right", 0.6);
    // total damage, every digit
    g.font = `22px ${FM}`; g.fillStyle = MUTED; g.textAlign = "left"; g.fillText("TOTAL DAMAGE", x0, y + 70);
    const s = dealt.toString(), per = 51;
    g.font = `34px ${FM}`; g.fillStyle = dealt >= GOOGOL ? GOLD : CYAN;
    for (let k = 0; k * per < Math.max(1, s.length); k++) g.fillText(s.slice(k * per, k * per + per), x0, y + 110 + k * 42);
    // digit bar
    const digits = dealt === 0n ? 0 : s.length, by = y + 210, bw = L.side;
    g.fillStyle = "#121a2c"; g.fillRect(x0, by, bw, 14);
    g.fillStyle = GOLD; g.fillRect(x0, by, bw * Math.min(1, digits / 101), 14);
    g.font = `22px ${FM}`; g.fillStyle = INK; g.textAlign = "left"; g.fillText(`${digits} / 101 DIGITS`, x0, by + 40);
    g.textAlign = "right"; g.fillStyle = MUTED; g.fillText("A GOOGOL HAS 101 DIGITS", x1, by + 40);
  }
  function drawTimer() {
    const left = Math.max(0, LIMIT - (sim ? sim.t : 0));
    let col = INK;
    if (state === "won") col = (Math.floor(endT * 4) % 2) ? INK : GOLD;
    else if (state === "run" && left <= 5) col = RED;
    glowText(left.toFixed(2), W / 2, L.timer, `900 84px ${FD}`, col);
  }
  function drawEnd() {
    const a = Math.min(1, endT / 0.4), cy = L.sy + L.side / 2, bh = 360;
    g.globalAlpha = a * 0.88; g.fillStyle = BG; g.fillRect(0, cy - bh / 2, W, bh); g.globalAlpha = a;
    g.fillStyle = GOLD; g.fillRect(0, cy - bh / 2, W, 4); g.fillRect(0, cy + bh / 2 - 4, W, 4);
    const sc = 1 + Math.max(0, 0.4 - endT) * 1.5;
    g.save(); g.translate(W / 2, cy - 90); g.scale(sc, sc); glowText("YES.", 0, 0, `900 120px ${FD}`, GOLD); g.restore();
    g.globalAlpha = a;
    glowText(`1 GOOGOL DAMAGE IN ${KILL_T.toFixed(2)}s`, W / 2, cy + 20, `900 40px ${FD}`, INK);
    glowText(`${KILL_HITS} HITS · LAST HIT = F(${KILL_HITS}), A 100-DIGIT NUMBER`, W / 2, cy + 90, `26px ${FM}`, CYAN, "center", 0.6);
    g.globalAlpha = 1;
  }

  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(stat, 0, 0);
    if (!sim) return;
    g.setTransform(1, 0, 0, 1, rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
    drawTimer();
    g.save(); g.beginPath(); g.rect(L.sx + 2, L.sy + 2, L.side - 4, L.side - 4); g.clip();
    if (state !== "won") drawBoss();
    drawBall();
    g.restore();
    for (const s of shards) {
      g.globalAlpha = Math.max(0, s.life); g.fillStyle = s.c;
      g.save(); g.translate(s.x, s.y); g.rotate(s.a); g.fillRect(-s.s / 2, -s.s / 3, s.s, s.s * 0.66); g.restore();
    }
    g.globalAlpha = 1; g.fillStyle = "#fff3cf";
    for (const p of sparks) { g.globalAlpha = Math.min(1, p.life * 2.5); g.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
    g.globalAlpha = 1;
    for (const p of pops) { g.globalAlpha = Math.min(1, p.life * 2); glowText(p.txt, p.x, p.y - 30, `${p.big ? 46 : 30}px ${FM}`, p.big ? GOLD : "#ffffff", "center", 0.7); }
    g.globalAlpha = 1;
    drawPanel();
    if (state === "won") drawEnd();
    if (state === "run" && sim.hits >= KILL_HITS - 3) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      const vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop & controls ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  function ready() {
    newRun(); state = "ready";
    const bt = document.getElementById("startBtn"); bt.disabled = false; bt.textContent = "TAP TO START";
  }
  function start() {
    if (SEED === null) return;
    initAudio(); if (ac && ac.state === "suspended") ac.resume();
    const el = document.documentElement;
    try { const p = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    document.getElementById("startUi").hidden = true; document.getElementById("endUi").hidden = true;
    document.body.classList.add("running");
    newRun(); state = "run"; last = performance.now();
  }
  document.getElementById("startUi").addEventListener("click", start);
  document.getElementById("endUi").addEventListener("click", start);
  window.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && SEED !== null && state !== "run") { e.preventDefault(); start(); } });
  window.addEventListener("resize", layout);
  document.addEventListener("fullscreenchange", layout);

  window.__fib = { get t() { return sim ? sim.t : 0; }, get hits() { return sim ? sim.hits : 0; }, get state() { return state; }, get seed() { return SEED; }, get killT() { return KILL_T; }, get dealt() { return dealt.toString(); } };
  const boot = () => { layout(); requestAnimationFrame(frame); setTimeout(() => prepare(0), 30); };
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`900 60px Orbitron`), document.fonts.load(`34px "Share Tech Mono"`)]).then(boot, boot);
  else boot();
})();
</script>
</body>
</html>
